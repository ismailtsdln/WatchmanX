[package]
name = "watchmanx"
version = "0.1.0"
edition = "2021"
authors = ["Ismail Tasdelen"]
description = "A high-performance file watcher and automation tool"

[dependencies]
anyhow = "1.0"
clap = { version = "4.4", features = ["derive"] }
glob = "0.3"
notify = "6.1"
regex = "1.10"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
serde_yaml = "0.9"
tokio = { version = "1.35", features = ["full"] }
toml = "0.8"
tracing = "0.1"
tracing-subscriber = "0.3"
colored = "2.1"
futures = "0.3"
tokio-util = "0.7"

[dev-dependencies]
tempfile = "3.9"
